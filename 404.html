<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Страница не найдена — TONVISIT</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="stylesheet" href="/src/css/styles.css" />
  </head>

  <body>
    <main class="section" style="min-height: 100vh; display: grid; place-items: center">
      <div class="container" style="max-width: 560px; text-align: center">
        <div class="card" style="padding: 48px 32px; text-align: center">
          <div
            class="stat__value"
            style="font-size: 84px; margin-bottom: 8px"
            aria-hidden="true"
          >
            404
          </div>
          <h1 style="font-size: 26px; margin-bottom: 12px">Страница не найдена</h1>
          <p class="lead" style="margin: 0 auto 28px; text-align: center">
            Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную —
            там есть все услуги и цены.
          </p>
          <div style="display: grid; gap: 10px">
            <a href="/" class="btn btn--primary btn--block">На главную</a>
            <a href="/#services" class="btn btn--ghost btn--block">Смотреть услуги</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
