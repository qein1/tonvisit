<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Спасибо за заявку — TONVISIT</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="stylesheet" href="/src/css/styles.css" />
  </head>

  <body>
    <main class="section" style="min-height: 100vh; display: grid; place-items: center">
      <div class="container" style="max-width: 560px; text-align: center">
        <div
          class="card"
          style="padding: 48px 32px; align-items: center; text-align: center"
        >
          <div
            class="card__icon"
            style="width: 66px; height: 66px; margin: 0 auto 24px"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24" style="width: 30px; height: 30px">
              <path d="M20 6 9 17l-5-5" fill="none" stroke="#2ecc71" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>

          <h1 style="font-size: 30px; margin-bottom: 12px">Заявка отправлена</h1>
          <p class="lead" style="margin: 0 auto 28px; text-align: center">
            Спасибо! Мы получили вашу заявку и свяжемся с вами в течение рабочего дня.
            Если вопрос срочный — напишите нам в Telegram.
          </p>

          <div style="display: grid; gap: 10px; width: 100%">
            <a href="https://t.me/tonvisit_support" class="btn btn--tg btn--lg" id="tg-btn">
              Написать в Telegram
            </a>
            <a href="/" class="btn btn--ghost btn--block">Вернуться на главную</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
